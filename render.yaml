services:
  - type: web
    name: jev-ultrafast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: jev
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUTF8
        value: "1"
      - key: TYPESAFE_DEMO_PORT
        value: "10000"
      - key: TYPESAFE_MODEL
        value: typesafe/jev-1.13
      - key: TEXT_MODEL
        value: inception/mercury-2.5
      - key: TEXT_MODEL_REASONING
        value: none
      - key: OPENROUTER_API_KEY
        sync: false
