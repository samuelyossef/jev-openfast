[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Yossef / Copyxyz" }]
keywords = ["browser agent", "browser automation", "llm", "chrome", "cdp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "cryptography>=45,<48",
    "httpx[http2]>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/samuelyossef/jev-openfast-browser"
Issues = "https://github.com/samuelyossef/jev-openfast-browser/issues"
Changelog = "https://github.com/samuelyossef/jev-openfast-browser/blob/main/CHANGELOG.md"

[project.scripts]
jev = "jev_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
